name: Resume

# Пересобирает portfolio.pdf при изменении резюме или README,
# чтобы PDF в профиле не устаревал. Коммитит только если файл изменился.
on:
  push:
    paths:
      - "resume/**"
      - "README.md"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить matplotlib
        run: pip install matplotlib

      - name: Собрать portfolio.pdf
        run: python resume/make_resume.py

      - name: Закоммитить, если изменился
        run: |
          if [[ -n "$(git status --short portfolio.pdf)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio.pdf
            git commit -m "portfolio.pdf: пересобран из resume/"
            git push
          else
            echo "PDF не изменился"
          fi
